<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Attendance - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div style="text-align:center; padding: 32px 0 24px;">
            <h2 style="color:var(--primary);">Smart Attendance</h2>
            <p style="color:var(--text-light); font-size:14px; margin-top:4px;">TAU - Take and Track Attendance</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('student')">Student</button>
            <button class="tab" onclick="switchTab('teacher')">Teacher</button>
        </div>

        <div class="card" id="login-form">
            <div id="login-title" class="card-title">Student Login</div>
            <div class="form-group">
                <label id="id-label">Student ID</label>
                <input type="text" id="user-id" placeholder="Enter your student ID" autocomplete="username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
            </div>
            <div id="login-error" class="error-msg" style="display:none; margin-bottom:12px;"></div>
            <button class="btn btn-primary btn-block" onclick="login()">Login</button>
        </div>
    </div>

    <div id="toast" style="display:none;"></div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
