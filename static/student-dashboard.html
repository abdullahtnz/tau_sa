<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - Smart Attendance</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/vendor/jsqr.min.js"></script>
    <script src="js/vendor/fp.min.js"></script>
</head>
<body>
    <div class="navbar">
        <span class="logo">Smart Attendance</span>
        <div class="user-info">
            <span id="student-name"></span>
            <button class="btn btn-secondary btn-sm" onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="container container-wide">
        <div style="display:flex; justify-content:space-between; align-items:center; margin: 24px 0 16px; gap:12px; flex-wrap:wrap;">
            <h3>My Attendance</h3>
            <div style="display:flex; gap:8px;">
                <button class="btn btn-primary" onclick="openScanner()">Scan QR Code</button>
                <button class="btn btn-success" onclick="openCodeEntry()">Enter Code</button>
            </div>
        </div>

        <div class="card">
            <div id="attendance-table"></div>
            <div class="loading" id="loading">Loading attendance records...</div>
            <div class="empty-state" id="empty" style="display:none;">No attendance records found.</div>
        </div>
    </div>

    <div class="modal-overlay" id="scanner-modal" style="display:none;">
        <div class="modal">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                <h3>Scan QR Code</h3>
                <button class="btn btn-secondary btn-sm" onclick="stopScanner()">Close</button>
            </div>
            <video id="video" style="width:100%; border-radius:8px;" autoplay playsinline></video>
            <div id="scan-status" style="text-align:center; margin-top:12px; color:var(--text-light);">
                Point your camera at the QR code
            </div>
            <div id="scan-error" class="error-msg" style="display:none; margin-top:8px; text-align:center;"></div>
        </div>
    </div>

    <div class="modal-overlay" id="code-modal" style="display:none;">
        <div class="modal">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                <h3>Enter Attendance Code</h3>
                <button class="btn btn-secondary btn-sm" onclick="closeCodeEntry()">Close</button>
            </div>
            <div class="form-group">
                <label>QR Session ID (ask your teacher)</label>
                <input type="number" id="qr-session-id-input" placeholder="e.g. 5">
            </div>
            <div class="form-group">
                <label>6-Digit Code</label>
                <input type="text" id="numeric-code-input" placeholder="e.g. 847291" maxlength="6" inputmode="numeric" pattern="[0-9]{6}" style="font-size:24px; text-align:center; letter-spacing:8px; font-weight:700;">
            </div>
            <div id="code-error" class="error-msg" style="display:none; margin-bottom:12px;"></div>
            <button class="btn btn-success btn-block" onclick="submitCode()">Submit Attendance</button>
        </div>
    </div>

    <div id="toast" style="display:none;"></div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/student.js"></script>
</body>
</html>
